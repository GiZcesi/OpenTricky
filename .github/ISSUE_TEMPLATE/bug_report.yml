name: Bug report
description: Something crashes, looks wrong, sounds wrong or doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [Known issues](https://github.com/GiZcesi/OpenTricky#known-issues) first.
        **Never attach your disc image, game files or a link to them.**
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in SETTINGS → ADVANCED → About OpenTricky, or the release name (for example 0.1.4).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Say where in the game (menu, track, mode).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Single Event → Race → Garibaldi
        2. Fall at the first jump
        3. ...
  - type: dropdown
    id: often
    attributes:
      label: How often?
      options: [Every time, Often, Sometimes, Once]
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Preset, resolution, screen shape, field of view, frame rate limit, smooth edges, soft shadows, draw distance. You can paste your `settings.ini` (next to `OpenTricky.exe`); remove the disc image path if it shows your name.
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC
      placeholder: Windows 11, RTX 4070 Super, i7-12700, 1440p 165 Hz monitor, Xbox controller
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Drag `SSX Tricky.log` (next to `settings.ini`) here before you start the game again, as each start replaces it. SETTINGS → ADVANCED → Log file is on by default. You can also attach the zip that SETTINGS → ADVANCED → Bug report → Prepare… saves on your Desktop.
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Press F12 in the game; the pictures are in the Screenshots folder next to `OpenTricky.exe`.
